{% extends "base.html" %}

{% block content %}
<div classs="row justify-content-center">
  <div class="col-md-8">
    <h2>Complete Appointment</h2>
    <hr>

    <div class="card mb-3">
      <div class="card-header">
        Appointment Details
      </div>
      <div class="card-body">
        <h5 class="card-title">Patient: {{ appointment.patient.name }}</h5>
        <p class="card-text"><strong>Date:</strong> {{ appointment.date }}</p>
        <p class="card-text"><strong>Time:</strong> {{ appointment.time }}</p>
      </div>
    </div>

    <h4>Add Diagnosis and Treatment</h4>
    <form method="POST" action="{{ url_for('complete_appointment', appointment_id=appointment.id) }}">

      <div class="mb-3">
        <label for="diagnosis" class="form-label">Diagnosis</label>
        <textarea class="form-control" id="diagnosis" name="diagnosis" rows="3" required></textarea>
      </div>

      <div class="mb-3">
        <label for="prescription" class="form-label">Prescription (Optional)</label>
        <textarea class="form-control" id="prescription" name="prescription" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label for="notes" class="form-label">Other Notes (Optional)</label>
        <textarea class="form-control" id="notes" name="notes" rows="2"></textarea>
      </div>

      <button type="submit" class="btn btn-success">Mark as Completed</button>
      <a href="{{ url_for('doctor_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>

  </div>
</div>
{% endblock %}
