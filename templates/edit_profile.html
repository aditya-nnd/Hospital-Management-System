{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>Edit Your Profile</h2>
    <hr>

    <form method="POST" action="{{ url_for('edit_profile') }}">

      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ patient.name }}" required>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number (Optional)</label>
        <input type="text" class="form-control" id="phone" name="phone" value="{{ patient.phone or '' }}">
      </div>

      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" value="{{ current_user.username }}" readonly>
        <div class="form-text">Username cannot be changed.</div>
      </div>

      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('patient_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>

  </div>
</div>
{% endblock %}
