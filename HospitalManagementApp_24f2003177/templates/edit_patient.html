{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>Edit Patient: {{ patient.name }}</h2>
    <hr>
    <form method="POST" action="{{ url_for('edit_patient', patient_id=patient.id) }}">
      
      <div class="mb-3">
        <label for="name" class="form-label">Patient's Full Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ patient.name }}" required>
      </div>
      
      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="text" class="form-control" id="phone" name="phone" value="{{ patient.phone or '' }}">
      </div>

      <div class="mb-3">
        <label for="username" class="form-label">Login Username</label>
        <input type="text" class="form-control" id="username" name="username" value="{{ patient.user.username }}" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">New Password (Optional)</label>
        <input type="password" class="form-control" id="password" name="password">
        <div class="form-text">Leave blank to keep the current password.</div>
      </div>
      
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('manage_patients') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
